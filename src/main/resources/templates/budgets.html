<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('Budgets')"></head>
<body>
<nav th:replace="fragments :: nav('budgets')"></nav>
<main class="wrap">
  <h1>Budgets</h1>
  <p class="sub">Set a monthly limit per category. You get a warning on the dashboard at 80% and again when you go over. Showing <strong th:text="${monthLabel}">this month</strong>.</p>

  <div class="alert error" th:if="${error}" th:text="${error}"></div>

  <form class="card" method="post" th:action="@{/budgets}">
    <h2>Set or update a budget</h2>
    <div class="row">
      <div>
        <label for="category" style="margin-top:0">Category</label>
        <select id="category" name="category">
          <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
        </select>
      </div>
      <div>
        <label for="limitText" style="margin-top:0">Monthly limit (&#8377;)</label>
        <input id="limitText" name="limitText" type="number" step="0.01" min="0.01" required>
      </div>
      <div style="flex:0"><button class="btn" type="submit">Save</button></div>
    </div>
  </form>

  <div class="card">
    <h2>Your budgets</h2>
    <div class="empty" th:if="${statuses.isEmpty()}">No budgets yet. Add one above.</div>
    <div class="budget" th:each="b : ${statuses}">
      <div class="top">
        <span th:text="${b.category}">Food</span>
        <span>
          <span th:text="${b.percent}">0</span>%
          <form class="inline" method="post" th:action="@{/budgets/{id}/delete(id=${ids.get(b.category)})}" onsubmit="return confirm('Remove this budget?')">
            <button class="btn danger sm" type="submit">Remove</button>
          </form>
        </span>
      </div>
      <div class="bar" th:classappend="${b.level != 'ok'} ? ${b.level}"><span th:style="'width:' + ${b.barPercent} + '%'"></span></div>
      <div class="meta">
        &#8377;<span th:text="${#numbers.formatDecimal(b.spent,1,'COMMA',2,'POINT')}">0</span> spent of
        &#8377;<span th:text="${#numbers.formatDecimal(b.limit,1,'COMMA',2,'POINT')}">0</span> &middot;
        <span th:if="${b.remaining.signum() >= 0}">&#8377;<span th:text="${#numbers.formatDecimal(b.remaining,1,'COMMA',2,'POINT')}">0</span> left</span>
        <span class="bad" th:if="${b.remaining.signum() < 0}">over by &#8377;<span th:text="${#numbers.formatDecimal(b.remaining.negate(),1,'COMMA',2,'POINT')}">0</span></span>
      </div>
    </div>
  </div>
</main>
</body>
</html>
